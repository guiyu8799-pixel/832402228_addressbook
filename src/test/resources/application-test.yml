spring:
  datasource:
    url: jdbc:sqlite:./target/test-data/addressbook-test.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  jpa:
    database-platform: org.sqlite.hibernate.dialect.SQLiteDialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB

app:
  database:
    path: ./target/test-data/addressbook-test.db

logging:
  level:
    root: WARN
    com.fzu.addressbook: INFO
